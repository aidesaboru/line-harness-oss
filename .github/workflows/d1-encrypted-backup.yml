name: Daily encrypted D1 backup

on:
  schedule:
    # 03:17 JST. Avoid the top of the hour when scheduled runners are busiest.
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: d1-encrypted-backup-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup-and-restore-check:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.D1_ENCRYPTED_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure SQLite restore tool
        run: |
          set -euo pipefail
          if ! command -v sqlite3 > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes sqlite3
          fi
          sqlite3 --version

      - name: Export encrypt and restore-check D1
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_NAME"
          test -n "$D1_DATABASE_ID"
          test -n "$D1_BACKUP_ENCRYPTION_KEY"
          echo "::add-mask::$D1_BACKUP_ENCRYPTION_KEY"
          umask 077

          plain_dir="$(mktemp -d "$RUNNER_TEMP/d1-backup-plain-XXXXXX")"
          artifact_dir="$RUNNER_TEMP/d1-backup-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$artifact_dir"
          trap 'rm -rf -- "$plain_dir"' EXIT
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=d1-encrypted-backup-$(date -u +%Y-%m-%d)-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

          wrangler_config="$plain_dir/wrangler.jsonc"
          node - "$wrangler_config" <<'NODE'
          const fs = require('node:fs');
          const output = process.argv[2];
          const required = ['CLOUDFLARE_ACCOUNT_ID', 'D1_DATABASE_NAME', 'D1_DATABASE_ID'];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is required`);
          }
          fs.writeFileSync(output, JSON.stringify({
            name: 'd1-backup-restore-check',
            compatibility_date: '2026-08-14',
            account_id: process.env.CLOUDFLARE_ACCOUNT_ID,
            d1_databases: [{
              binding: 'DB',
              database_name: process.env.D1_DATABASE_NAME,
              database_id: process.env.D1_DATABASE_ID,
            }],
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

          verification_sql="$(pnpm tsx scripts/d1-backup-verify.ts sql)"
          source_snapshot="$plain_dir/source-snapshot.json"
          pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" \
            --config "$wrangler_config" --remote --yes --json \
            --command "$verification_sql" > "$source_snapshot"

          plain_backup="$plain_dir/backup.sql"
          encrypted_backup="$artifact_dir/backup.sql.enc"
          export_log="$plain_dir/export.log"
          if ! pnpm exec wrangler d1 export "$D1_DATABASE_NAME" \
            --config "$wrangler_config" --remote --output "$plain_backup" \
            > "$export_log" 2>&1; then
            echo 'D1 export failed without exposing its temporary download URL' >&2
            exit 1
          fi
          rm -f -- "$export_log"
          test -s "$plain_backup"
          pnpm tsx scripts/d1-backup-crypto.ts encrypt "$plain_backup" "$encrypted_backup"
          rm -f -- "$plain_backup"

          restored_sql="$plain_dir/restore.sql"
          restored_db="$plain_dir/restore.sqlite3"
          restore_log="$plain_dir/restore.log"
          pnpm tsx scripts/d1-backup-crypto.ts decrypt "$encrypted_backup" "$restored_sql"
          if ! sqlite3 "$restored_db" < "$restored_sql" > "$restore_log" 2>&1; then
            echo 'SQLite restore verification failed without exposing SQL contents' >&2
            exit 1
          fi
          rm -f -- "$restore_log"
          rm -f -- "$restored_sql"

          restored_snapshot="$plain_dir/restored-snapshot.json"
          integrity_result="$plain_dir/integrity.json"
          foreign_key_result="$plain_dir/foreign-key.json"
          sqlite3 -json "$restored_db" "$verification_sql" > "$restored_snapshot"
          sqlite3 -json "$restored_db" "PRAGMA integrity_check" > "$integrity_result"
          sqlite3 -json "$restored_db" \
            "SELECT CASE WHEN EXISTS (SELECT 1 FROM pragma_foreign_key_check) THEN 'failed' ELSE 'ok' END AS foreign_key_check" \
            > "$foreign_key_result"

          pnpm tsx scripts/d1-backup-verify.ts verify \
            --source "$source_snapshot" \
            --restored "$restored_snapshot" \
            --integrity "$integrity_result" \
            --foreign-key "$foreign_key_result" \
            --encrypted "$encrypted_backup" \
            --receipt "$artifact_dir/verification.json"

          {
            echo '### D1バックアップ結果'
            echo ''
            echo '暗号化バックアップの作成と一時DBへの復元確認に成功しました'
            echo '本番DBへの書き込みや復元は行っていません'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified encrypted backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: ${{ steps.backup.outputs.artifact_dir }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Remove encrypted runner files
        if: ${{ always() && steps.backup.outputs.artifact_dir != '' }}
        env:
          ARTIFACT_DIR: ${{ steps.backup.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_DIR" in
            "$RUNNER_TEMP"/d1-backup-artifact-*) rm -rf -- "$ARTIFACT_DIR" ;;
            *) echo 'Refusing to remove an unexpected artifact path' >&2; exit 1 ;;
          esac

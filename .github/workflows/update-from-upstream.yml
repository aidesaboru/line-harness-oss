name: Update from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    if: github.repository != 'Shudesu/line-harness-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Shudesu/line-harness-oss.git
          git fetch upstream main

      - name: Detect upstream changes
        id: detect
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create update branch
        if: steps.detect.outputs.has_changes == 'true'
        id: branch
        run: |
          branch="upstream/update-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/main
        if: steps.detect.outputs.has_changes == 'true'
        id: merge
        run: |
          if git merge --no-edit upstream/main; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream has conflicts and needs a reviewed manual merge"
          fi

      - name: Push update branch
        if: steps.detect.outputs.has_changes == 'true' && steps.merge.outputs.succeeded == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        if: steps.detect.outputs.has_changes == 'true' && steps.merge.outputs.succeeded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: update from upstream" \
            --body "This PR imports the latest Shudesu/line-harness-oss main into this fork.\n\nMerge this PR to receive upstream fixes and features, then let the existing Cloudflare deploy workflows update your environment."

      - name: Record conflicts for reviewed resolution
        if: steps.detect.outputs.has_changes == 'true' && steps.merge.outputs.succeeded == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="chore: upstream sync needs conflict resolution"
          body="Automatic upstream sync found merge conflicts and made no changes to main. Review upstream/main against this fork in a separate branch. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: No upstream changes
        if: steps.detect.outputs.has_changes == 'false'
        run: echo "Fork is already up to date with upstream/main."
